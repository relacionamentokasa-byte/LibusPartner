services:
  - type: web
    name: libus-partner
    runtime: node
    plan: starter
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npx prisma migrate deploy --schema=backend/prisma/schema.prisma && npm --prefix frontend run build && npm --prefix backend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Libus Partner <onboarding@resend.dev>
